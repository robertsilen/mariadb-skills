###############################################################################
# capacity-curve.properties  —  mariadb-taf skill template
#
# QUESTION:  On this host, at how many concurrent clients does throughput stop
#            scaling, and where does latency take off? Is a bigger instance
#            worth it?
# VARIABLE:  Thread count, swept in one run. To compare hosts or instance
#            sizes, run this same file unchanged on each host and give each
#            run its own taf.test_case_tag.
#
# HOW TO USE
#   1. Copy to properties/local/capacity.properties and size the
#      [db_config] block to the host. Start from the TAF repo's
#      database_config_files/mariadb/mariadb_comparable_4vcpu_16gb.cnf or
#      ..._16vcpu_32gb.cnf when the host matches one of those.
#   2. Set taf.threads to run well past the host's core count. The knee
#      is only visible if the sweep goes beyond it.
#   3. perl taf.pl --properties-file=properties/local/capacity.properties \
#                  --action=init-start-db-build-client-run-tests
#   4. Read the HTML report, or compare hosts with
#      scripts/ResultsCompareRaw.pl.
#
# Checked against MariaDB/taf commit 95f15ee (2026-10-09).
###############################################################################

[db_config_start]
[mysqld]
max_connections          = 2000
open_files_limit         = 65535
table_open_cache         = 4096
thread_cache_size        = 256
innodb_buffer_pool_size  = CHANGE_ME_ABOUT_60_PERCENT_OF_RAM
innodb_log_file_size     = 1G
innodb_flush_method      = O_DIRECT
innodb_file_per_table    = 1
innodb_flush_neighbors   = 0
[db_config_end]

taf.test_case_tag          = CHANGE_ME_CAPACITY_HOSTNAME
taf.comments               = "Capacity curve: thread sweep on one host"

taf.action                 = init-start-db-run-tests
taf.test_type              = adhoc
taf.db_engine              = innodb
taf.db_clients_use_unix_socket = true
taf.db_process_rest_enable = true
taf.db_process_rest_low    = 6
taf.db_process_rest_high   = 20

## ---------------------------------------------------------------------------
## Workload — sysbench-lua, durations in SECONDS
## Runtime ~ 2 tests x 9 thread counts x 3 iterations x 120 s = 108 min + setup
## ---------------------------------------------------------------------------
taf.test_suite             = sysbench-lua
taf.tests                  = POINT_SELECT,OLTP_RW
taf.threads                = 1,2,4,8,16,32,64,128,256
taf.iterations             = 3
taf.duration               = 120
taf.warmup_duration        = 120
taf.warmup_threads         = 32

sysbench_lua.db_driver        = mariadb
sysbench_lua.number_of_tables = 8
sysbench_lua.number_of_rows   = 1000000

taf.report_plugin          = taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm
taf.verbose                = true
