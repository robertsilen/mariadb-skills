###############################################################################
# config-change.properties  —  mariadb-taf skill template
#
# QUESTION:  Does this one server setting help, hurt, or do nothing for an
#            OLTP workload on this host?
# VARIABLE:  ONE line inside the [db_config] block. Nothing else changes.
#
# HOW TO USE
#   1. Copy this file twice, e.g. properties/local/cfg-A.properties and
#      cfg-B.properties.
#   2. In each copy change ONLY the line marked CHANGE_ME_THE_VARIABLE and
#      taf.test_case_tag. The same active install is used for both runs.
#   3. Run A, then B:
#        perl taf.pl --properties-file=properties/local/cfg-A.properties
#        perl taf.pl --properties-file=properties/local/cfg-B.properties
#      (the first run on a fresh install needs
#       --action=init-start-db-build-client-run-tests)
#   4. Compare the two *.raw.txt files with scripts/ResultsCompareRaw.pl.
#
# A real example of this pattern in the TAF repo:
#   properties/mariadb/mdevs/MDEV32750_AHI_ON.properties / _AHI_OFF.properties
#   (innodb_adaptive_hash_index on vs off, HammerDB TPROC-C)
#
# Storage engine comparisons follow the same pattern. The variable is then
# taf.db_engine plus the engine's own settings. See
#   properties/mariadb/sysbench_tidesdb10_innodb_rocks_compare.properties
#
# Checked against MariaDB/taf commit 95f15ee (2026-10-09).
###############################################################################

[db_config_start]
[mysqld]
max_connections          = 1000
open_files_limit         = 65535
table_open_cache         = 4096
thread_cache_size        = 128
innodb_buffer_pool_size  = 4G
innodb_log_file_size     = 1G
innodb_flush_method      = O_DIRECT
innodb_file_per_table    = 1
innodb_flush_neighbors   = 0
## The one setting under test, e.g. thread_handling = pool-of-threads
## vs. one-thread-per-connection. Remove this comment, keep one line.
CHANGE_ME_THE_VARIABLE   = CHANGE_ME_VALUE
[db_config_end]

## ---------------------------------------------------------------------------
## Identity — change per copy
## ---------------------------------------------------------------------------
taf.test_case_tag          = CHANGE_ME_CFG_A
taf.comments               = "Config change: one server setting is the only variable"

## ---------------------------------------------------------------------------
## Lifecycle — init gives each run a fresh datadir with the new config
## ---------------------------------------------------------------------------
taf.action                 = init-start-db-run-tests
taf.test_type              = adhoc
taf.db_engine              = innodb
taf.db_clients_use_unix_socket = true
taf.db_process_rest_enable = true
taf.db_process_rest_low    = 6
taf.db_process_rest_high   = 20

## ---------------------------------------------------------------------------
## Workload — sysbench-lua, durations in SECONDS
## Runtime ~ 2 tests x 5 thread counts x 3 iterations x 120 s = 60 min + setup
## Pick tests that exercise the setting: write-path settings need OLTP_RW or
## UPDATE_*; read-path settings need POINT_SELECT / OLTP_RO.
## ---------------------------------------------------------------------------
taf.test_suite             = sysbench-lua
taf.tests                  = OLTP_RO,OLTP_RW
taf.threads                = 1,8,32,64,128
taf.iterations             = 3
taf.duration               = 120
taf.warmup_duration        = 120
taf.warmup_threads         = 32

sysbench_lua.db_driver        = mariadb
sysbench_lua.number_of_tables = 8
sysbench_lua.number_of_rows   = 1000000

## ---------------------------------------------------------------------------
## Reporting
## ---------------------------------------------------------------------------
taf.report_plugin          = taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm
taf.verbose                = true
