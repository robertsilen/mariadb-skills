###############################################################################
# upgrade-check.properties  —  mariadb-taf skill template
#
# QUESTION:  Will moving from MariaDB version A to version B change throughput
#            or latency for an OLTP workload on this host?
# VARIABLE:  The active database software install. Nothing else changes.
#
# HOW TO USE
#   1. Install both versions:  perl taf.pl --db-software-install \
#                                --db-software-install-packages=<bintar>
#   2. Copy this file twice, e.g. properties/local/upgrade-A.properties and
#      upgrade-B.properties. The ONLY difference between the copies is
#      taf.test_case_tag and taf.db_software_install_dir.
#   3. First run on each install needs a client build:
#        perl taf.pl --properties-file=<file> \
#                    --action=init-start-db-build-client-run-tests
#   4. Compare the two *.raw.txt files with scripts/ResultsCompareRaw.pl.
#
# The [db_config] block is pinned so both versions run the same settings
# instead of their own defaults. Every variable in it must exist on BOTH
# versions, or the older server will not start.
#
# Checked against MariaDB/taf commit 95f15ee (2026-10-09).
###############################################################################

[db_config_start]
[mysqld]
max_connections          = 1000
open_files_limit         = 65535
table_open_cache         = 4096
thread_cache_size        = 128
innodb_buffer_pool_size  = 4G
innodb_log_file_size     = 1G
innodb_flush_method      = O_DIRECT
innodb_file_per_table    = 1
innodb_flush_neighbors   = 0
[db_config_end]

## ---------------------------------------------------------------------------
## Identity — change per copy
## ---------------------------------------------------------------------------
taf.test_case_tag          = CHANGE_ME_UPGRADE_11.4.8
taf.comments               = "Upgrade check: same workload and config, version is the only variable"
taf.db_software_install_dir= CHANGE_ME_PATH_FROM_--list-database-software-installs

## ---------------------------------------------------------------------------
## Lifecycle
## ---------------------------------------------------------------------------
taf.action                 = init-start-db-run-tests
taf.test_type              = adhoc
taf.db_engine              = innodb
taf.db_clients_use_unix_socket = true

## Wait for the server to go idle after data load before measuring
taf.db_process_rest_enable = true
taf.db_process_rest_low    = 6
taf.db_process_rest_high   = 20

## ---------------------------------------------------------------------------
## Workload — sysbench-lua, durations in SECONDS
## Runtime ~ 3 tests x 5 thread counts x 3 iterations x 120 s = 90 min + setup
## ---------------------------------------------------------------------------
taf.test_suite             = sysbench-lua
taf.tests                  = POINT_SELECT,OLTP_RO,OLTP_RW
taf.threads                = 1,8,32,64,128
taf.iterations             = 3
taf.duration               = 120
taf.warmup_duration        = 120
taf.warmup_threads         = 32

## 8 x 1M rows is roughly 2 GB: it fits in the 4G buffer pool, so this is an
## in-memory test. Raise number_of_rows past the buffer pool for an I/O-bound one.
sysbench_lua.db_driver        = mariadb
sysbench_lua.number_of_tables = 8
sysbench_lua.number_of_rows   = 1000000

## ---------------------------------------------------------------------------
## Reporting — keep taf_res_raw_text.pm: ResultsCompareRaw.pl reads its output
## ---------------------------------------------------------------------------
taf.report_plugin          = taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm
taf.verbose                = true
